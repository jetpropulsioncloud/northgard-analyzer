<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'nonce-theLonghouse2025';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self' https://firestore.googleapis.com https://*.firebaseio.com https://www.googleapis.com;
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
  ">
  <meta charset="UTF-8">
  <title>View Build</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 0;
      margin: 0;
      background-color: transparent;
      background-image: none;
      color: white;
    }

    .title-bar {
      -webkit-app-region: drag;
      user-select: none;
      background-color: rgba(30, 30, 30, 0.85);
      padding: 10px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title-bar * {
      -webkit-app-region: no-drag;
    }

    .title-bar button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      padding: 4px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .title-bar button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #buildViewerContainer {
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
    }

    .build-step {
      margin-left: 10px;
      margin-bottom: 5px;
    }

    .phase-header {
      margin-top: 15px;
      font-size: 15px;
      color: #ddd;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #ffda7b;
    }
  </style>
</head>
<body>
  <div class="draggable-wrapper">
    <div class="build-title-bar">
      <div class="build-title-left">
        <div class="build-title-text">Build Viewer</div>
        <div class="build-subtitle">(Requires Northgard in Windowed or Borderless Mode)</div>
      </div>
      <button id="closeAppBtn">X</button>
    </div>
    <div id="buildViewerContainer" class="no-drag-scrollable">
      <div id="buildContent"></div>
    </div>

<script type="module" nonce="theLonghouse2025">
  const { ipcRenderer } = require('electron');

  // Close the popup
  function closeApp() {
    window.close();
  }

  // Pick emoji for a step
  function getEmojiForStep(step) {
    const s = step.toLowerCase();
    if (s.includes("wood") || s.includes("lodge")) return "🌲";
    if (s.includes("house")) return "🏠";
    if (s.includes("scout")) return "🧭";
    if (s.includes("colonize")) return "📍";
    if (s.includes("training") || s.includes("military")) return "⚔️";
    if (s.includes("feast")) return "🍽️";
    if (s.includes("clear") || s.includes("attack")) return "🛡️";
    if (s.includes("trade post")) return "🏦";
    if (s.includes("warchief")) return "🪓";
    if (s.includes("brewery")) return "🍺";
    if (s.includes("mine") || s.includes("mining")) return "⛏️";
    if (s.includes("fish")) return "🐟";
    if (s.includes("merchant")) return "🛍️";
    if (s.includes("fisherman")) return "🎣";
    if (s.includes("forge")) return "🛠️";
    if (s.includes("altar")) return "🕯️";
    if (s.includes("relic")) return "🗿";
    if (s.includes("ready")) return "✅";
    return "•";
  }

  let currentBuild = null;
  let buildSections = [];
  let currentSectionIndex = 0;

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function splitBuildIntoSections(steps) {
    const sections = [];
    let current = {
      title: "Build",
      steps: []
    };

    (steps || []).forEach(step => {
      const cleanStep = String(step || "").trim();

      if (!cleanStep) {
        return;
      }

      if (cleanStep.startsWith("#")) {
        if (current.steps.length > 0 || current.title !== "Build") {
          sections.push(current);
        }

        current = {
          title: cleanStep.replace(/^#\s*/, "").trim() || "Section",
          steps: []
        };

        return;
      }

      current.steps.push(cleanStep);
    });

    if (current.steps.length > 0 || sections.length === 0) {
      sections.push(current);
    }

    return sections;
  }

  function renderSingleStep(step) {
    return `<div class="build-step">${getEmojiForStep(step)} ${escapeHtml(step)}</div>`;
  }

  function renderSectionPills() {
    const nav = document.getElementById("sectionNav");

    if (!nav) {
      return;
    }

    nav.innerHTML = buildSections.map((section, index) => {
      const active = index === currentSectionIndex ? "active" : "";
      return `<button class="section-pill ${active}" data-section-index="${index}">${escapeHtml(section.title)}</button>`;
    }).join("");

    nav.querySelectorAll(".section-pill").forEach(button => {
      button.addEventListener("click", () => {
        goToSection(Number(button.dataset.sectionIndex));
      });
    });
  }

  function renderCurrentSection() {
    const panel = document.getElementById("sectionStepPanel");
    const counter = document.getElementById("sectionCounter");

    if (!panel || !counter || buildSections.length === 0) {
      return;
    }

    const section = buildSections[currentSectionIndex];

    panel.innerHTML = `
      <h3 class="current-section-title">📅 ${escapeHtml(section.title)}</h3>
      ${section.steps.length > 0
        ? section.steps.map(renderSingleStep).join("")
        : `<p><em>No steps listed for this section.</em></p>`}
    `;

    counter.textContent = `${currentSectionIndex + 1} / ${buildSections.length}`;
    renderSectionPills();
  }

  function goToSection(index) {
    if (buildSections.length === 0) {
      return;
    }

    if (index < 0) {
      currentSectionIndex = 0;
    } else if (index >= buildSections.length) {
      currentSectionIndex = buildSections.length - 1;
    } else {
      currentSectionIndex = index;
    }

    renderCurrentSection();
  }

  function nextSection() {
    goToSection(currentSectionIndex + 1);
  }

  function previousSection() {
    goToSection(currentSectionIndex - 1);
  }

  ipcRenderer.on("overlay-next-section", () => {
    nextSection();
  });

  ipcRenderer.on("overlay-prev-section", () => {
    previousSection();
  });

  ipcRenderer.on("overlay-first-section", () => {
    goToSection(0);
  });

  ipcRenderer.on("overlay-last-section", () => {
    goToSection(buildSections.length - 1);
  });

  ipcRenderer.on('load-build', (event, build) => {
    currentBuild = build;
    buildSections = splitBuildIntoSections(build.steps || []);
    currentSectionIndex = 0;

    const tags = (build.situationalTags || []).join(', ') || 'None';

    const html = `
      <h2>${escapeHtml(build.name)} (${escapeHtml(build.clan)})</h2>
      ${build.militaryPath ? `<p><strong>⚔️ Military Path:</strong> ${escapeHtml(build.militaryPath)}</p>` : ''}
      <button id="toggleLoreBtn">📜 Show Lore</button>
      <div id="loreViewer" style="display:none; margin-top: 16px;"></div>
      <p><strong>🌍 Tags:</strong> ${escapeHtml(tags)}</p>
      <hr>

      <div id="sectionNav" class="section-nav"></div>

      <div class="section-controls">
        <button id="prevSectionBtn">◀ Prev</button>
        <div id="sectionCounter" class="section-counter"></div>
        <button id="nextSectionBtn">Next ▶</button>
      </div>

      <div id="sectionStepPanel"></div>

      <div class="overlay-help">
        Hotkeys: Ctrl+Alt+J = next section · Ctrl+Alt+K = previous section · Ctrl+Alt+H = first · Ctrl+Alt+E = last · Alt+L = lock/unlock
      </div>
    `;

    document.getElementById('buildContent').innerHTML = html;

    document.getElementById("prevSectionBtn").addEventListener("click", previousSection);
    document.getElementById("nextSectionBtn").addEventListener("click", nextSection);

    const toggleLoreBtn = document.getElementById("toggleLoreBtn");
    const loreViewer = document.getElementById("loreViewer");

    toggleLoreBtn.addEventListener("click", () => {
      if (loreViewer.style.display === "none") {
        showLore(build);
        loreViewer.style.display = "block";
        toggleLoreBtn.textContent = "📜 Hide Lore";
      } else {
        loreViewer.style.display = "none";
        toggleLoreBtn.textContent = "📜 Show Lore";
      }
    });

    renderCurrentSection();
  });

  // Show the lore tree in read-only mode
  function showLore(build) {
    const container = document.getElementById("loreViewer");
    container.innerHTML = "";

    const order = build.loreOrder || [];
    if (order.length === 0) {
      container.innerHTML = "<p><em>No lore order available.</em></p>";
      return;
    }

    const looksNumeric = (v) => Number.isFinite(v) || /^\d+$/.test(String(v));
    const isTree = (build.loreMode === 'tree') || order.every(looksNumeric);

    if (isTree) {
      const iframe = document.createElement("iframe");
      iframe.src = "lore-tree.html";
      iframe.style.cssText = "width:100%;height:400px;border:none;border-radius:8px;";
      iframe.onload = () => {
        try {
          const idx = order.map(n => parseInt(n, 10));
          iframe.contentWindow.setSelectedLoreIndexes(idx);
        } catch (err) {
          console.error("Failed to set lore:", err);
        }
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const style = doc.createElement('style');
        style.textContent = `
          button, [role="button"], a, input, select, textarea, .clickable {
            pointer-events: none !important;
          }
        `;
        doc.head.appendChild(style);
      };
      container.appendChild(iframe);
      iframe.style.pointerEvents = "none";
    } else {
      const items = order.map((l, i) => `<li>${i + 1}. ${l}</li>`).join('');
      container.innerHTML = `<div><strong>📜 Lore Order:</strong><ul>${items}</ul></div>`;
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('closeAppBtn');
    if (!btn) return;
    btn.addEventListener('click', () => {
      try { window.close(); } catch (_) {}
    });
  });
</script>
<script>
  (() => {
    const overlayScrollIpc = require('electron').ipcRenderer;

    function getScrollableElement() {
      const elements = Array.from(document.querySelectorAll('body, body *'));

      const scrollableElements = elements.filter(element => {
        const style = window.getComputedStyle(element);
        const canScroll = element.scrollHeight > element.clientHeight + 20;
        const notHidden = style.overflowY !== 'hidden';

        return canScroll && notHidden;
      });

      scrollableElements.sort((a, b) => {
        const aScroll = a.scrollHeight - a.clientHeight;
        const bScroll = b.scrollHeight - b.clientHeight;

        return bScroll - aScroll;
      });

      return scrollableElements[0] || document.scrollingElement || document.documentElement;
    }

    function scrollOverlay(amount) {
      const element = getScrollableElement();

      element.scrollBy({
        top: amount,
        left: 0,
        behavior: 'smooth'
      });
    }

    function scrollOverlayTo(position) {
      const element = getScrollableElement();

      element.scrollTo({
        top: position,
        left: 0,
        behavior: 'smooth'
      });
    }

    overlayScrollIpc.on('overlay-scroll-down', () => {
      scrollOverlay(180);
    });

    overlayScrollIpc.on('overlay-scroll-up', () => {
      scrollOverlay(-180);
    });

    overlayScrollIpc.on('overlay-scroll-page-down', () => {
      scrollOverlay(500);
    });

    overlayScrollIpc.on('overlay-scroll-page-up', () => {
      scrollOverlay(-500);
    });

    overlayScrollIpc.on('overlay-go-top', () => {
      scrollOverlayTo(0);
    });

    overlayScrollIpc.on('overlay-go-bottom', () => {
      const element = getScrollableElement();

      scrollOverlayTo(element.scrollHeight);
    });
  })();
</script>
</body>
</html>
